<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#86868b"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="20" fill="#f5f5f7"/>

  <g filter="url(#s)">
    <rect x="24" y="72" width="200" height="96" rx="16" fill="#fff"/>
    <rect x="24" y="272" width="200" height="96" rx="16" fill="#fff"/>
    <rect x="290" y="28" width="300" height="384" rx="18" fill="#fff"/>
    <rect x="662" y="172" width="194" height="96" rx="16" fill="#fff"/>
  </g>

  <text x="124" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Relationship manager</text>
  <text x="124" y="132" text-anchor="middle" font-size="12.5" fill="#6e6e73">submits a request, or</text>
  <text x="124" y="149" text-anchor="middle" font-size="12.5" fill="#6e6e73">replaces it with a new one</text>

  <text x="124" y="310" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Reviewer</text>
  <text x="124" y="332" text-anchor="middle" font-size="12.5" fill="#6e6e73">approves or declines</text>
  <text x="124" y="349" text-anchor="middle" font-size="12.5" fill="#6e6e73">someone else's request</text>

  <text x="759" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Mortgage process</text>
  <text x="759" y="232" text-anchor="middle" font-size="12.5" fill="#6e6e73">reads the approved</text>
  <text x="759" y="249" text-anchor="middle" font-size="12.5" fill="#6e6e73">discount</text>

  <text x="440" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Pricing exception service</text>
  <text x="440" y="82" text-anchor="middle" font-size="12" fill="#6e6e73">FastAPI on SQLite</text>

  <g font-size="13" fill="#1d1d1f" text-anchor="middle">
    <rect x="310" y="100" width="260" height="40" rx="12" fill="#f5f5f7"/>
    <text x="440" y="125">HTTP API · idempotency keys</text>
    <rect x="310" y="148" width="260" height="40" rx="12" fill="#f5f5f7"/>
    <text x="440" y="173">Service · one transaction per action</text>
    <rect x="310" y="196" width="260" height="40" rx="12" fill="#f5f5f7"/>
    <text x="440" y="221">Domain rules</text>
    <rect x="310" y="244" width="260" height="40" rx="12" fill="#f5f5f7"/>
    <text x="440" y="269">Requests · event history</text>
  </g>

  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="311" y="310" width="56" height="22" rx="11" fill="#fff4e5"/>
    <text x="339" y="325" fill="#a35200">pending</text>
    <rect x="373" y="310" width="64" height="22" rx="11" fill="#e7f6ec"/>
    <text x="405" y="325" fill="#1d7a3a">approved</text>
    <rect x="443" y="310" width="60" height="22" rx="11" fill="#ffecea"/>
    <text x="473" y="325" fill="#c4271c">declined</text>
    <rect x="507" y="310" width="64" height="22" rx="11" fill="#ececee"/>
    <text x="539" y="325" fill="#636366">withdrawn</text>
  </g>
  <text x="440" y="362" text-anchor="middle" font-size="11.5" fill="#6e6e73">A new discount means a new, linked request,</text>
  <text x="440" y="379" text-anchor="middle" font-size="11.5" fill="#6e6e73">so an approval always matches what was reviewed</text>

  <g stroke="#86868b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M224 120 C 262 120, 268 120, 305 120"/>
    <path d="M224 320 C 270 320, 262 128, 305 124"/>
    <path d="M590 220 L 657 220"/>
  </g>
  <text x="624" y="210" text-anchor="middle" font-size="11" fill="#6e6e73">GET</text>
</svg>
